<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signing in…</title>
</head>
<body>
  <p id="status">Signing in…</p>
  <script type="module">
    // OAuth redirect target. Hand the result to the editor (same origin only) and close.
    // The BroadcastChannel covers sign-in pages that cut the window.opener link.
    const p = new URLSearchParams(location.search);
    const result = { type: 'ai-auth', code: p.get('code'), state: p.get('state'), error: p.get('error') };
    window.opener?.postMessage(result, location.origin);
    const channel = new BroadcastChannel('ai-auth');
    channel.postMessage(result);
    channel.close();
    window.close();
    // Still open (for example the page was opened by hand):
    document.getElementById('status').textContent = 'Sign-in finished. You can close this window.';
  </script>
</body>
</html>

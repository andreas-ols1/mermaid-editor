<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mermaid editor</title>
  <style>
    :root { --bg: #fff; --fg: #1f2328; --border: #ccc; --hover: #f3f3f3; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #282c34; --fg: #abb2bf; --border: #181a1f; --hover: #2c313c; color-scheme: dark; }
    body { margin: 0; display: grid; grid-template-columns: var(--left, 50%) 6px minmax(0, 1fr); height: 100vh; font-family: sans-serif; background: var(--bg); color: var(--fg); }
    #src { min-width: 0; }
    #divider { background: var(--border); cursor: col-resize; touch-action: none; transition: background 0.15s; }
    #divider:hover, #divider.dragging { background: #528bff; }
    body.dragging { user-select: none; cursor: col-resize; }
    #out { position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
    #out.panning { cursor: grabbing; }
    #stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    #msg { position: absolute; top: 0; left: 0; margin: 12px; white-space: pre-wrap; font: 13px monospace; }
    #tools { position: fixed; top: 8px; right: 12px; display: flex; gap: 8px; }
    #tools button { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; cursor: pointer; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
    #tools button:hover { background: var(--hover); }
  </style>
</head>
<body>
  <div id="src"></div>
  <div id="divider" title="Drag to resize. Double-click to reset."></div>
  <div id="out"><div id="stage"></div><pre id="msg"></pre></div>
  <div id="tools">
    <button id="fit" title="Fit to view (or double-click the preview)" aria-label="Fit to view"></button>
    <button id="theme"></button>
    <button id="copy" title="Copy as image" aria-label="Copy as image"></button>
    <button id="download" title="Download PNG" aria-label="Download PNG"></button>
    <button id="download-svg" title="Download SVG" aria-label="Download SVG"></button>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
